name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev ant

      - name: Install Buildozer & Cython
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Setup SDK & Force China Mirrors
        run: |
          # 1. 直接使用云端预装的 Android SDK
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROIDSDK=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROIDNDK=/usr/local/lib/android/sdk/ndk/25.1.8937393" >> $GITHUB_ENV
          
          # 同意协议
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          # 2. 手动克隆 p4a 源码（使用 Gitee 国内镜像）
          mkdir -p ~/.buildozer/android/platform
          git clone -b master --single-branch https://gitee.com/mirrors_kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android

          # 3. 暴力替换所有致命依赖的下载链接为国内镜像（彻底断绝连外网失败的问题）
          # 替换 Python 源码为淘宝镜像
          sed -i "s|https://github.com/python/cpython/archive/refs/tags/v{version}.tar.gz|https://registry.npmmirror.com/-/binary/python/{version}/Python-{version}.tgz|" ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/hostpython3/__init__.py
          sed -i "s|https://github.com/python/cpython/archive/refs/tags/v{version}.tar.gz|https://registry.npmmirror.com/-/binary/python/{version}/Python-{version}.tgz|" ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py
          # 替换 Libffi 为华为云镜像
          sed -i "s|https://github.com/libffi/libffi/releases/download/v{version}/libffi-{version}.tar.gz|https://mirrors.huaweicloud.com/libffi/libffi-{version}.tar.gz|" ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/libffi/__init__.py
          # 替换 OpenSSL 为华为云镜像
          sed -i "s|https://www.openssl.org/source/openssl-{version}.tar.gz|https://mirrors.huaweicloud.com/openssl/source/openssl-{version}.tar.gz|" ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/openssl/__init__.py

      - name: Build with Buildozer
        run: |
          rm -rf ~/.buildozer/android/platform/apache-ant-1.9.4
          ln -sf /usr/share/ant ~/.buildozer/android/platform/apache-ant-1.9.4
          rm -rf .buildozer
          
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-kivy-apk
          path: bin/*.apk
