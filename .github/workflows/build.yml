name: Build Flet App

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flet-Android-App
          path: ${{ steps.build.outputs.archive-path }}
