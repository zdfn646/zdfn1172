name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ★ 核心步骤：使用社区维护的 Buildozer Action
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          # 指定打包命令
          command: buildozer android debug
          # 指定 Buildozer 版本，'stable' 代表最新稳定版
          buildozer_version: stable

      # 上传生成的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-kivy-apk
          # 这个 Action 会自动提供 APK 的路径
          path: ${{ steps.buildozer.outputs.filename }}
