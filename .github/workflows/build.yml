name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ★ 安装所有可能缺失的底层编译工具
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Fix SDK paths & Licenses
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager || true
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager /usr/local/lib/android/sdk/tools/bin/avdmanager || true
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          # 必须锁定 0.29.36，这是 Kivy 构建的硬性要求
          pip3 install buildozer cython==0.29.36

      - name: Build with Buildozer
        run: |
          export BUILDOZER_WARN_ON_ROOT=1
          # 强制环境变量覆盖
          export ANDROIDSDK=/usr/local/lib/android/sdk
          export ANDROIDNDK=/usr/local/lib/android/sdk/ndk/25.1.8937393
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24
          
          # 清理残留后重新打包
          rm -rf ~/.buildozer/android/platform/
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-kivy-apk
          path: bin/*.apk
