name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    # ★ 核心修复：直接使用 Kivy 官方提供的稳定 Docker 镜像
    container:
      image: kivy/buildozer:2023.9.16
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        run: |
          # 在官方纯净容器内直接打包，无需折腾任何路径
          buildozer -v android debug

      - name: Fix APK permissions
        run: |
          chmod -R 777 bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-kivy-apk
          path: bin/*.apk
