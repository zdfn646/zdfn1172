name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer cython==0.29.36

      # ★ 核心修复：提前下载最新 SDK，并自动同意所有协议
      - name: Setup Android SDK & Agree Licenses
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          # 下载最新版命令行工具
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
          
          # 暴力同意所有协议
          yes | sdkmanager --licenses > /dev/null 2>&1
          
          # 预装需要的组件
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" > /dev/null 2>&1
          
          # 建立软链接，骗过旧版 Buildozer 的路径检查
          mkdir -p $HOME/android-sdk/tools/bin
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/avdmanager $HOME/android-sdk/tools/bin/avdmanager

      - name: Build with Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          
          export BUILDOZER_WARN_ON_ROOT=1
          # 强制环境变量指向我们的路径
          export ANDROIDSDK=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-kivy-apk
          path: bin/*.apk
