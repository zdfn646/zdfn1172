name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          # ★ 顺便用 apt 把 ant 也装上，防止后面网络抽风
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev ant

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Build with Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          
          # ★ 建立软链接，让 Buildozer 以为它已经下载好 ANT 了
          mkdir -p ~/.buildozer/android/platform
          ln -sf /usr/share/ant ~/.buildozer/android/platform/apache-ant-1.9.4 || true
          
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-kivy-apk
          path: bin/*.apk
