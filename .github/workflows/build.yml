name: Build Flet App

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build APK
        run: |
          flet build apk --project quxian --org com.mycompany --product "曲线行驶"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-apk
          path: build/apk/*.apk
          if-no-files-found: error
