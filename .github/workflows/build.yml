name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          
      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          # 锁定 Cython 0.29.36，这是 Kivy 兼容性最好的版本，绝对不能装最新的 3.x
          pip3 install buildozer cython==0.29.36

      - name: Build with Buildozer
        run: |
          # 移除 yes |，直接运行，环境变量会自动确认协议
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-kivy-apk
          path: bin/*.apk
