name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev ant

      - name: Install Buildozer & Cython
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Setup Android SDK & Licenses
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
          
          # ★ 终极修复：不用 yes，手动喂 10 个 y，彻底避开 Broken pipe 报错！
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | sdkmanager --licenses > /dev/null 2>&1 || true
          
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" > /dev/null 2>&1

      - name: Build with Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          
          export BUILDOZER_WARN_ON_ROOT=1
          export ANDROIDSDK=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          
          mkdir -p ~/.buildozer/android/platform
          ln -sf /usr/share/ant ~/.buildozer/android/platform/apache-ant-1.9.4
          
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quxian-kivy-apk
          path: bin/*.apk
